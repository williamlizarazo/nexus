[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appmemoria"
version = "0.1.0"
description = "Aplicacion PyShiny para explorar, auditar y operar la memoria investigativa"
requires-python = ">=3.11"
dependencies = [
    "shiny==1.8.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
