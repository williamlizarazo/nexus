[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appmemoria"
version = "0.1.0"
description = "Aplicacion PyShiny para explorar, auditar y operar la memoria investigativa"
requires-python = ">=3.11"
dependencies = [
    "shiny==1.8.0",
    "python-dotenv>=1.0,<2.0",
    "pandas>=2.0,<3.0",
    "supabase>=2.0,<3.0",
    "networkx>=3.3,<4.0",
    "ipysigma==0.24.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.setuptools]
py-modules = [
    "app",
    "server",
    "ui",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "auth*",
    "authorization*",
    "components*",
    "core*",
    "modules*",
    "presenters*",
    "services*",
    "visualizations*",
]
exclude = [
    "tests*",
    "www*",
]
