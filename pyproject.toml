[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-core"
version = "0.1.0"
description = "Nucleo compartido para memoria investigativa"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
supabase = [
    "supabase>=2.0"
]

dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = [
    "tests/unit"
]
